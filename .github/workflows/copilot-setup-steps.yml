name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4.5.0
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "20"

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.14.0

      - name: Install open-code-review CLI
        run: |
          sudo curl -fsSL https://github.com/alibaba/open-code-review/releases/download/v1.13.3/opencodereview-linux-amd64 -o /usr/local/bin/ocr
          sudo chmod +x /usr/local/bin/ocr

      - name: Compile backend classes
        run: ./gradlew :service-scheduler-server:classes -x test

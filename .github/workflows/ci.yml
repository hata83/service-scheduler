name: CI/CD

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trigger-reviews:
    name: Trigger Qodo & Kilo Code Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Trigger Qodo & Kilo Code Review on PR
        uses: actions/github-script@v7.0.1
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '/review'
            });
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '@kilocode-bot review code'
            });

  build-and-test:
    name: Build, Test, and Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: scheduler_test
          POSTGRES_USER: scheduler
          POSTGRES_PASSWORD: scheduler
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v4.5.0
        with:
          java-version: "25"
          distribution: temurin
          cache: gradle

      - name: Set up Node.js 20
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "20"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4.2.1

      - name: Format check (Spotless)
        run: ./gradlew spotlessCheck
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest

      - name: PMD
        run: ./gradlew pmdMain

      - name: Compile
        run: ./gradlew compileJava compileTestJava

      - name: Unit tests + ArchUnit + Testcontainers
        run: ./gradlew test
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/scheduler_test
          SPRING_DATASOURCE_USERNAME: scheduler
          SPRING_DATASOURCE_PASSWORD: scheduler
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: "6379"
          TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock

      - name: JaCoCo coverage report
        run: ./gradlew jacocoTestReport

      - name: JaCoCo coverage gate (80% overall, 100% @Service)
        run: ./gradlew jacocoTestCoverageVerification

      - name: Upload coverage report
        uses: actions/upload-artifact@v4.4.3
        if: always()
        with:
          name: jacoco-report
          path: service-scheduler-server/build/reports/jacoco/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4.4.3
        if: always()
        with:
          name: test-results
          path: service-scheduler-server/build/reports/tests/
          retention-days: 7

      - name: Start backend for Bruno tests
        run: |
          ./gradlew bootRun &
          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/actuator/health && break
            sleep 2
          done
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/scheduler_test
          SPRING_DATASOURCE_USERNAME: scheduler
          SPRING_DATASOURCE_PASSWORD: scheduler
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: "6379"

      - name: Bruno API contract tests
        working-directory: service-scheduler-server/src/test/bruno
        run: |
          mkdir -p ../../../../service-scheduler-server/build/reports/bruno
          npx --yes @usebruno/cli@2.14.1 run -r \
            --env local \
            --disable-cookies \
            --reporter-junit ../../../../service-scheduler-server/build/reports/bruno/results.xml
        env:
          BRUNO_BASE_URL: http://localhost:8080

      - name: Publish Bruno results
        uses: dorny/test-reporter@v1.9.1
        if: always()
        with:
          name: Bruno API Tests
          path: service-scheduler-server/build/reports/bruno/results.xml
          reporter: java-junit
          fail-on-empty: false

      - name: Install Playwright
        working-directory: service-scheduler-ui
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Reset the fixtures for the E2E suite
        run: ./gradlew :service-scheduler-server:resetAuthFixtures
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/scheduler_test
          SPRING_DATASOURCE_USERNAME: scheduler
          SPRING_DATASOURCE_PASSWORD: scheduler
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: "6379"

      - name: Playwright E2E tests
        working-directory: service-scheduler-ui
        run: npx playwright test
        env:
          BASE_URL: http://localhost:8080

      - name: Publish Playwright results
        uses: dorny/test-reporter@v1.9.1
        if: always()
        with:
          name: Playwright E2E Tests
          path: service-scheduler-ui/playwright-results.xml
          reporter: java-junit
          fail-on-empty: false

      - name: OpenSpec strict validate
        run: npx --yes @fission-ai/openspec@1.14.0 validate --all --strict

      - name: Full build gate
        run: ./gradlew clean build -x test
        env:
          SPRING_PROFILES_ACTIVE: test

  release:
    name: Build and Publish Docker Image
    needs: [build-and-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v4.5.0
        with:
          java-version: "25"
          distribution: temurin
          cache: gradle

      - name: Build JAR
        run: ./gradlew clean build -x test
        env:
          SPRING_PROFILES_ACTIVE: prod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.7.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5.5.1
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6.9.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2.0.8
        with:
          generate_release_notes: true
          files: service-scheduler-server/build/libs/*.jar
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed

management:
  endpoint:
    health:
      show-details: always
      show-components: always

app:
  auth:
    jwt:
      secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-in-prod-0123456789}
      cookie-secure: false
    otp:
      echo: true
      channel: zalo-stub

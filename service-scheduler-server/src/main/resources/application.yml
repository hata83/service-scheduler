spring:
  application:
    name: service-scheduler-server
  threads:
    virtual:
      enabled: true
  datasource:
    # Capacity 1: PostgreSQL 16 from Docker Compose for dev/local (HIL-1 round 4: no H2)
    # Compose maps host 5433 (host 5432 belongs to another local stack)
    url: jdbc:postgresql://localhost:5433/service_scheduler
    username: scheduler
    password: scheduler
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    defer-datasource-initialization: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when_authorized
      show-components: always
  health:
    redis:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      export:
        # Trace ids land in MDC and flow into JSON logs; spans stay local (design D12)
        enabled: false

app:
  auth:
    jwt:
      # Dev-only default; prod profile requires JWT_SECRET and fails fast without it
      secret: "dev-only-insecure-secret-change-me-in-prod-0123456789"
      issuer: "service-scheduler"
      ttl: 8h
      cookie-name: jwt
    otp:
      ttl: 5m
      echo: true
  ratelimits:
    # Dealership-scoped JSON with a default block + per-dealership overrides (design D7)
    location: classpath:config/rate-limits.json

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: service-scheduler-server
  threads:
    virtual:
      enabled: true
  datasource:
    # Capacity 1: PostgreSQL 16 from Docker Compose for dev/local (HIL-1 round 4: no H2)
    # Compose maps host 5433 (host 5432 belongs to another local stack)
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/service_scheduler}
    username: ${SPRING_DATASOURCE_USERNAME:scheduler}
    password: ${SPRING_DATASOURCE_PASSWORD:scheduler}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    defer-datasource-initialization: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      connect-timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics,info
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    redis:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      export:
        # Trace ids land in MDC and flow into JSON logs; spans stay local (design D12)
        enabled: false

app:
  auth:
    jwt:
      # Dev-only default; prod profile requires JWT_SECRET and fails fast without it
      secret: "dev-only-insecure-secret-change-me-in-prod-0123456789"
      issuer: "service-scheduler"
      ttl: 8h
      cookie-name: jwt
    otp:
      ttl: 5m
      echo: true
      channel: zalo-stub
    registration:
      # Phase 1 seeds one dealership, so a new customer joins it (design D4)
      default-dealership-id: "00000000-0000-0000-0000-000000000001"
  ratelimits:
    # Dealership-scoped JSON with a default block + per-dealership overrides (design D7)
    location: classpath:config/rate-limits.json
    # The prod profile keeps the forwarded address untrusted
    trust-forwarded-for: false

springdoc:
  show-actuator: true
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    try-it-out-enabled: true

server:
  servlet:
    encoding:
      charset: UTF-8
      force: true

# PR-Agent configuration for Unified Service Scheduler
#
# This configuration integrates PR-Agent with the repository's existing
# review guidelines from .github/copilot-instructions.md and AGENTS.md

[config]
# Include existing review guidelines as context
repo_context_files = [
    ".github/copilot-instructions.md",
    "AGENTS.md"
]

# Skip automated/dependency PRs
ignore_pr_title = [
    "^\\[Auto\\]",
    "^Auto",
    "^\\[Dependabot\\]",
    "^dependabot"
]

# Model configuration (choose one)
# Option 1: OpenAI (default, requires OPENAI_KEY)
model = "gpt-4o"
fallback_models = ["gpt-4o-mini"]

# Option 2: Groq (free, fast - requires GROQ_API_KEY)
# model = "groq/llama3-70b-8192"
# fallback_models = ["groq/llama3-8b-8192"]

# Option 3: Anthropic Claude (requires ANTHROPIC_API_KEY)
# model = "anthropic/claude-sonnet-4-20250514"
# fallback_models = ["anthropic/claude-3-haiku-20240307"]

# Option 4: OpenRouter (requires OPENROUTER_API_KEY)
# model = "openrouter/deepseek/deepseek-chat"
# fallback_models = ["openrouter/meta-llama/llama-3-8b-instruct"]

[pr_reviewer]
# Enforce the architecture constraints from AGENTS.md
extra_instructions = """
You are a senior staff engineer and code reviewer for the Unified Service Scheduler repository.
Enforce these architecture constraints strictly:

1. Package Independence: Domain packages under dev.hata.scheduler.* must never import each other.
2. Java 25 Virtual Threads: Never use synchronized in hot paths. Use ReentrantLock.
3. Pure Java Constraint Evaluator: Never introduce external native binary rule engines.
4. PostgreSQL GiST Booking Safety: Trust EXCLUDE USING gist constraints. No redundant locks.
5. Transactional Outbox: Write outbox_events in same transaction. Dispatch AFTER_COMMIT.
6. Mandatory Idempotency Keys: All mutating endpoints require X-Idempotency-Key header.
7. OpenAPI 3.1 & RFC 7807: All endpoints need SpringDoc annotations and application/problem+json errors.

Follow the inspection checklist from .github/copilot-instructions.md:
- Null Pointer & Optional Safety
- Concurrency & Thread Safety
- Resource Management
- Error Handling & RFC 7807 Conformance
- Security & Authentication
- Database & Persistence Integrity
- Testing Discipline

Write all review comments in ASD-STE100 Simplified Technical English:
- Active voice
- <=25 words per sentence
- No semicolons
"""

# Disable tests review (handled by CI)
require_tests_review = "false"

[pr_description]
# Enable automatic PR description generation
extra_instructions = """
Generate PR descriptions following the Unified Service Scheduler conventions.
Include a summary of changes, key capabilities, and verification gates passed.
"""

[pr_code_suggestions]
# Enable code suggestions
num_code_suggestions_per_chunk = 3
extra_instructions = """
Suggest improvements following Spring Boot 4.1.1 patterns and Java 25 best practices.
"""
